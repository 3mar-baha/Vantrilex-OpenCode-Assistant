[package]
name = "voxaura"
version = "0.4.4"
description = "Voxaura — sovereign ambient voice and agentic desktop shell."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Force-teardown: a Win32 Job Object with KILL_ON_JOB_CLOSE guarantees the
# children we spawn die with us, even on TerminateProcess (Task Manager /
# Stop-Process -Force), where the normal exit handler never runs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
