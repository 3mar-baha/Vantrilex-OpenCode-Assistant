<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340">
  <defs>
    <filter id="fv-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="340" rx="20" fill="#0a0f1d" stroke="#1e293b" stroke-width="2"/>
  <circle cx="200" cy="140" r="86" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="20 12" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" from="0 200 140" to="360 200 140" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="140" r="70" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="6 10" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="360 200 140" to="0 200 140" dur="6s" repeatCount="indefinite"/>
  </circle>
  <path d="M200,80 L248,102 V150 c0,30 -22,52 -48,52 s-48,-22 -48,-52 V102 Z" fill="#0f172a" stroke="#60a5fa" stroke-width="4" stroke-linejoin="round"/>
  <rect x="188" y="118" width="24" height="34" rx="12" fill="#38bdf8" filter="url(#fv-glow)">
    <animate attributeName="opacity" dur="1.6s" repeatCount="indefinite" values="1;0.35;1"/>
  </rect>
  <text x="200" y="262" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#f8fafc">zero-secret</text>
  <text x="200" y="296" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, monospace" font-size="20" fill="#34d399">AES-256-GCM vault</text>
</svg>
