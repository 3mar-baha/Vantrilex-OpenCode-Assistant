  <g class="r3"><circle cx="60" cy="190" r="16" fill="none" stroke="#10b981" stroke-width="4"/><path d="M52,190 l6,6 l11,-12" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/><text x="95" y="199" class="step">agent/model · 204</text></g>
  <g class="r4"><circle cx="60" cy="250" r="16" fill="none" stroke="#10b981" stroke-width="4"/><path d="M52,250 l6,6 l11,-12" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/><text x="95" y="259" class="step">matrix idle · 8/8 green</text></g>
