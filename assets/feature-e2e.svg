<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340">
  <rect width="640" height="340" rx="20" fill="#0a0f1d" stroke="#1e293b" stroke-width="2"/>
  <line x1="60" y1="54" x2="60" y2="266" stroke="#1e293b" stroke-width="3"/>
  <style>
    .step { font-family: monospace; font-size: 24px; fill: #60a5fa; }
    .r1 { animation: rev 10s infinite; } .r2 { animation: rev 10s infinite; animation-delay: 2s; animation-fill-mode: backwards; }
    .r3 { animation: rev 10s infinite; animation-delay: 4s; animation-fill-mode: backwards; } .r4 { animation: rev 10s infinite; animation-delay: 6s; animation-fill-mode: backwards; }
    @keyframes rev { 0% { opacity: 0.25; } 8%,78% { opacity: 1; } 90%,100% { opacity: 0.25; } }
  </style>
  <g class="r1"><circle cx="60" cy="70" r="16" fill="none" stroke="#10b981" stroke-width="4"/><path d="M52,70 l6,6 l11,-12" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/><text x="95" y="79" class="step">boot shell · bridge live</text></g>
